<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nav-Template</title>
     
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../public/css/global.css" />
    <link rel="stylesheet" href="../public/css/mediaQueries/MQ-global.css" />
 
    </head>
    <body> 

    <!-- content header -->
    <header class="header-content">
      
      <div class="badge text-bg-primary text-wrap" style="width: 100%;">
        Envios gratis por compras superiores a $200.000
      </div>

      <!-- menu navegacion -->
      <div class="info-header">
        <div class="menu-hamburguesa">
          <button class="abrir-nav" id="abrir"></button>
          <nav class="content-nav" id="nav">
            <button class="cerrar-nav" id="cerrar">X</button>
            <ul class="nav-list">
              <li><a href="plants.html"   class="enlace-nav">Plantas</a></li>
              <li><a href="news.html"     class="enlace-nav">Noticias</a></li>
              <li><a href="learn.html"    class="enlace-nav">Talleres</a></li>
              <li><a href="about.html"    class="enlace-nav" >Nosotros</a></li>
              <li><a href="contact.html"  class="enlace-nav">Contactanos</a></li>    
            </ul>
          </nav>
        </div>

        <div class="content-logo">
          <a href="index.html"> <img src="/src/public/img/LogoMonsteralPng.webp" alt="imagen logo"/></a>
        </div>

        <div class="content-search-tablet">
          <input type="search" id="search" class="search-tablet" placeholder="¿Que estas buscando?" />
          <img src="../public/img/macgnificGlass.webp" alt="" class="img-lupa" />
        </div>

        <div class="icons-content">

          <a href="register.html"><img class="icons" src="../public/img/user.webp" alt=" img user" /></a>   
          
          <!--------------------------- Carrito ------------------------------>
          <div class="container-car" id="cart-container">
            <div id="cart-icon"> 
            <a href="#"><img class="icons" id="verCarrito" src="../public/img/car.webp" alt="img car"/></a>  
            <span class="quantity">0</span>
            </div>
            <nav>
                <div class="buy-card" id="buy-card">
                  <h1>Carrito de compras</h1>
                  <ul class="navCard" id="cart-items-header">
                    <li>Imagen</li>
                    <li>Nombre</li>
                    <li>Precio</li>
                    <li>Cantidad</li>     
                  </ul>
                  <div id="cart-items" class="cartItems"></div>
                  <div class="total" id="total">Total: $</div>
                    <div class="checkout">
                    <button id="empty-cart">Vaciar Carrito</button>
                    <div class="close" id="close-cart">Cerrar</div> 
                </div>
              </div>
            </nav>
          </div>
          <!--------------------------- Fin Carrito ------------------------------>

          <a href="https://web.whatsapp.com/"><img class="icons" src="../public/img/whatsapp.webp" alt="img whatsapp" /></a> 
      </div>
    </div>

     <!-- Contenedor de productos -->
     <div id="products-container" class="plant-container"></div>


      <!-- </div> -->
      <div class="content-search">
        <input type="search" id="search" class="search" placeholder="¿Que estas buscando?" />
        <img src="../public/img/macgnificGlass.webp" alt="image glass" class="img-lupa" />
      </div>
      <div class="content-navigation">
        <nav class="content-nav-tablet" id="nav">
          <ul class="nav-list-tablet">
            <li><a href="plants.html" class="enlace-nav">Plantas</a></li>
            <li><a href="news.html" class="enlace-nav">Noticias</a></li>
            <li><a href="learn.html" class="enlace-nav">Talleres</a></li>
            <li><a href="about.html" class="enlace-nav">Nosotros</a></li>
            <li><a href="contact.html" class="enlace-nav">Contactenos</a></li>

          </ul>
        </nav>
  
      </div>


    </header>

  <script src="/src/js/stock.js"></script>

  

  </body> 
</html>
